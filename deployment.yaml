apiVersion: apps/v1

kind: Deployment

metadata:
  name: kubernetes-web

spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-web
  
  template:
    metadata:
      labels:
        app: kubernetes-web
    spec:
      containers:
        - name: kubernetes-web
          image: kubernetes-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3331
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
